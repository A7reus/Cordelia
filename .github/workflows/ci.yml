name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  vet-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test with race
        run: go test -race ./...
